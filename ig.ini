[IG]
#template = fhir.base.template#current

ig = fsh-generated/resources/ImplementationGuide-racsel.org.json

; Terminology server config used by _genonce.bat
; tx-mode: online | offline
tx-mode = online
tx-server = https://tx.fhir.org/r4

cache = input-cache
template = #template_ph4h
html-in-zip = true 
qa-suppressions = qa-suppressions.txt
txCache = input-cache/txCache
; ; 

; # === RENDIMIENTO Y VALIDACIÓN ===
; validator = internal                    # internal, none, or validatorUrl
; logging = WARN                          # ERROR, WARN, INFO, DEBUG
; no-network = true                       # Modo offline
; html-in-zip = true                      # Comprime HTML en ZIP
; #do-not-check-dependencies = false       # Salta verificación de dependencias
; 

; # === GENERACIÓN DE CONTENT ===
; #watchForChanges = false                 # Watch mode para desarrollo
; gen-examples = true                     # Generar ejemplos
; do-not-generate-snapshot = true       # Salta snapshots (acelera)
; # generate-spiral = false                 # Generar en espiral (desarrollo)

; # === VALIDACIÓN ESPECÍFICA ===
; check-aggregation = false                # Deshabilitar para acelerar
; check-cardinality = false                # Deshabilitar para acelerar
; check-must-support = false               # Deshabilitar para acelerar
; check-publication = false                # Deshabilitar para acelerar
; check-speed = true                        # Modo rápido (menos validaciones)
  